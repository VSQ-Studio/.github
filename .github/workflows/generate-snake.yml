name: Generate contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate light and dark contribution snakes
        uses: Platane/snk/svg-only@v3
        with:
          # Set this repository variable to a public maintainer GitHub username.
          # The snake generator reads a USER contribution calendar, not an organization calendar.
          github_user_name: ${{ vars.SNAKE_GITHUB_USERNAME }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%235BCEFA&color_dots=%23EBEDF0,%23BFE8F7,%2388D8F1,%23F5A9B8,%23D9809A
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23F5A9B8&color_dots=%23161B22,%233A4451,%235BCEFA,%23F5A9B8,%23FFFFFF

      - name: Publish generated SVG files to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
