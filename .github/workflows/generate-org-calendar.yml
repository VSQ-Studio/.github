name: Generate organization contribution calendar

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate organization-wide commit calendar
        run: python3 scripts/generate_org_contributions.py
        env:
          ORG_NAME: VSQ-Studio
          # Optional fine-grained PAT for a higher API rate limit.
          # Public repositories can be read without this secret.
          ORG_READ_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
          CALENDAR_DAYS: 365
          OUTPUT_DIR: dist

      - name: Publish generated SVG calendars to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
