name: Generate organization contribution calendar

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Generate organization-wide daily commit calendar
        run: python3 scripts/generate_org_contributions.py
        env:
          ORG_NAME: VSQ-Studio
          # Optional fine-grained PAT with Metadata: read for public repositories.
          # Add it as ORG_READ_TOKEN only if the unauthenticated API rate limit is insufficient.
          ORG_READ_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
          CALENDAR_DAYS: 365
          OUTPUT_DIR: profile/assets

      - name: Commit updated calendar assets
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/assets/org-contribution-calendar.svg profile/assets/org-contribution-calendar-dark.svg
          if git diff --cached --quiet; then
            echo "Calendar assets are unchanged."
            exit 0
          fi
          git commit -m "chore: update organization contribution calendar [skip ci]"
          git push origin "HEAD:${DEFAULT_BRANCH}"
