<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">VSQ Studio Pixel Header</title>
  <desc id="desc">A pixel-art inspired banner in VSQ Studio's geometric brand style.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#FFFFFF" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="250" fill="#111318"/>
  <rect width="1200" height="250" fill="url(#grid)"/>
  <rect x="14" y="14" width="1172" height="222" fill="none" stroke="#444B57" stroke-width="4" shape-rendering="crispEdges"/>
  <rect x="14" y="14" width="52" height="8" fill="#5BCEFA" shape-rendering="crispEdges"/>
  <rect x="14" y="14" width="8" height="52" fill="#5BCEFA" shape-rendering="crispEdges"/>
  <rect x="1134" y="228" width="52" height="8" fill="#F5A9B8" shape-rendering="crispEdges"/>
  <rect x="1178" y="184" width="8" height="52" fill="#F5A9B8" shape-rendering="crispEdges"/>

  <!-- Angular hexagon mark, echoing the organization's geometric avatar. -->
  <g shape-rendering="crispEdges">
    <path d="M104 75H170L204 125L170 175H104L70 125Z" fill="#171B22" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="miter"/>
    <path d="M101 103H117L139 147H123Z" fill="#5BCEFA"/>
    <path d="M144 103H160L182 147H166Z" fill="#F5A9B8"/>
    <rect x="116" y="92" width="40" height="7" fill="#FFFFFF"/>
    <rect x="116" y="151" width="40" height="7" fill="#FFFFFF"/>
    <rect x="92" y="121" width="8" height="8" fill="#5BCEFA"/>
    <rect x="174" y="121" width="8" height="8" fill="#F5A9B8"/>
  </g>

  <g font-family="'Courier New', Courier, monospace">
    <text x="246" y="119" font-size="66" font-weight="700" letter-spacing="3" fill="#FFFFFF">VSQ STUDIO</text>
    <rect x="248" y="139" width="470" height="5" fill="#5BCEFA" shape-rendering="crispEdges"/>
    <rect x="718" y="139" width="90" height="5" fill="#F5A9B8" shape-rendering="crispEdges"/>
    <text x="248" y="181" font-size="22" font-weight="700" letter-spacing="4" fill="#C9D0DA">BUILD  /  SHARE  /  EXPLORE</text>
    <text x="248" y="211" font-size="14" letter-spacing="2" fill="#858E9B">OPEN SOURCE · COLLABORATION · CREATIVE TECHNOLOGY</text>
  </g>

  <!-- Pixel blocks on the right form a restrained signal pattern. -->
