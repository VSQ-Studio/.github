    <rect x="732" y="139" width="90" height="5" fill="#F5A9B8" shape-rendering="crispEdges" />
    <text x="262" y="181" font-size="22" font-weight="700" letter-spacing="4" fill="#394454">BUILD  /  SHARE  /  EXPLORE</text>
    <text x="262" y="211" font-size="14" letter-spacing="2" fill="#687586">OPEN SOURCE · COLLABORATION · CREATIVE TECHNOLOGY</text>
  </g>

