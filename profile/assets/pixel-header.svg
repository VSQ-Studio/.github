<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1200" height="250" viewBox="0 0 1200 250"
     role="img" aria-labelledby="title desc">
  <title id="title">VSQ Studio Pixel Header — Light Theme</title>
  <desc id="desc">VSQ Studio official organization logo with a pixel-art inspired banner. This file is selected automatically for the GitHub light color theme.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#718096" stroke-opacity="0.075" stroke-width="1" />
    </pattern>
    
  </defs>
  <rect width="1200" height="250" fill="#F7F9FC" />
  <rect width="1200" height="250" fill="url(#grid)" />
  <rect x="14" y="14" width="1172" height="222" fill="none" stroke="#AAB5C3" stroke-width="4" shape-rendering="crispEdges" />
  <rect x="14" y="14" width="52" height="8" fill="#5BCEFA" shape-rendering="crispEdges" />
  <rect x="14" y="14" width="8" height="52" fill="#5BCEFA" shape-rendering="crispEdges" />
  <rect x="1134" y="228" width="52" height="8" fill="#F5A9B8" shape-rendering="crispEdges" />
  <rect x="1178" y="184" width="8" height="52" fill="#F5A9B8" shape-rendering="crispEdges" />

  <!-- Official VSQ-Studio organization avatar. In dark mode the source logo is inverted
       so the dark mark becomes white and its white canvas blends into the dark banner. -->
  <rect x="60" y="47" width="164" height="164" fill="#FFFFFF" stroke="#8C98A8" stroke-width="4" shape-rendering="crispEdges" />
  <image x="64" y="51" width="156" height="156"
         href="https://avatars.githubusercontent.com/u/342573852?s=200&amp;v=4" xlink:href="https://avatars.githubusercontent.com/u/342573852?s=200&amp;v=4"
         preserveAspectRatio="xMidYMid meet" />

